<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Modern employee management, attendance tracking, and payroll system." />
  <meta name="theme-color" content="#F5F7FB" />
  <title>StaffFlow</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('staffflow-theme');
        var theme = stored === 'dark' ? 'dark' : 'light';
        var root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#0A0A0B' : '#F5F7FB');
        }
        root.classList.add('no-transitions');
        window.addEventListener('DOMContentLoaded', function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              root.classList.remove('no-transitions');
            });
          });
        });
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
